model:
  implementation: set_only
  attention_family: dense
  backend: exact
  architecture: transformer_lm
  vocab_size: 0

  d_model: 64
  num_heads: 4
  num_layers: 1
  dim_feedforward: 128
  dropout: 0.0
  attn_dropout: 0.0
  resid_dropout: 0.0
  ffn_dropout: 0.0
  max_seq_len: 64

  window_size: 4
  stride: 2
  set_causality_mode: strict_past
  output_residual_mode: anchor_span
  allow_token_token: false
  candidate_fiber: endpoint_window

  pooling:
    mode: soft_trimmed_boltzmann
    tau: 0.1
    q: 0.85
  pooling_multihead: false

  d_phi: 64
  set_state_dim: 64
  adapter_type: auto
  feature_mode: hashed_counts
  feature_params:
    num_bins: 32
    hash_seed: 13
    normalize: true
  geometry:
    enabled: true
    apply_as_bias: true
    apply_in_phi_attn: true
  router_type: learned
  router_topk: 8
  router_temperature: 1.0
  router:
    min_temp: 0.5
    score_mode: candidate_gather
  router_multihead: true
  token_mlp:
    enabled: false

  anchor:
    enabled: false
    target: pre_encoder
    pre_encoder_layers: 2
    lambda_h: 0.1
    detach_target: true
    norm: layernorm
    teacher:
      enabled: false
  set_diversity:
    lambda_div: 0.0
  multivector_basis:
    enabled: false
    r: 1

data:
  dataset: wikitext2
  batch_size: 2
  seq_len: 64
  limit: 8
  val_limit: 4

training:
  seed: 0
  epochs: 1
  lr: 0.0001
  warmup_steps: 0
  set_diversity_weight: 0.0
  set_diversity_mode: position_contrastive
