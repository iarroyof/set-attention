model:
  implementation: hybrid_token_set
  attention_family: sparse
  backend: local_band
  architecture: transformer_lm
  vocab_size: 0
  d_model: 384
  num_heads: 8
  num_layers: 6
  dim_feedforward: 1536
  dropout: 0.1
  attn_dropout: 0.1
  resid_dropout: 0.1
  ffn_dropout: 0.1
  max_seq_len: 512
  causal: true
  set_causality_mode: strict_past
  output_residual_mode: empty_only
  d_phi: 384
  set_state_dim: 384
  adapter_type: auto
  hybrid:
    pattern: TTTTSS
    set_topologies:
      - {window_size: 4, stride: 2}
      - {window_size: 8, stride: 4}
  pooling:
    mode: soft_trimmed_boltzmann
    tau: 0.1
    q: 0.85
    alpha: 10.0
    learnable_alpha: false
  pooling_multihead: false
  feature_mode: hashed_counts
  feature_params:
    num_bins: 128
    hash_seed: 13
    normalize: true
  router_type: learned
  router_topk: 16
  router_temperature: 1.0
  router_multihead: true
  router:
    min_temp: 0.5
  token_mlp:
    enabled: false
  backend_params:
    radius: 4

data:
  dataset: wikitext2
  batch_size: 16
  seq_len: 512

training:
  seed: 0
  epochs: 10
  lr: 0.0001
  warmup_steps: 1000
  set_diversity_weight: 0.0
  set_diversity_mode: position_contrastive

logging:
  wandb:
    enable: true
    project: set-attention
