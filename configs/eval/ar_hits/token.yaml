model:
  implementation: baseline_token
  attention_family: dense
  backend: exact
  architecture: transformer_lm
  vocab_size: 0
  d_model: 384
  num_heads: 8
  num_layers: 6
  dim_feedforward: 1536
  dropout: 0.1
  attn_dropout: 0.1
  resid_dropout: 0.1
  ffn_dropout: 0.1
  max_seq_len: 2048
  causal: true

data:
  dataset: wikitext2
  batch_size: 4
  seq_len: 2048
  streaming: true

training:
  seed: 0
  epochs: 0
  lr: 0.0001
  warmup_steps: 1000
  checkpoint:
    eval_only_from: null
