model:
  implementation: set_only
  attention_family: linear
  backend: landmark
  architecture: transformer_lm
  vocab_size: 0
  d_model: 384
  num_heads: 8
  num_layers: 6
  dim_feedforward: 1536
  dropout: 0.1
  attn_dropout: 0.1
  resid_dropout: 0.1
  ffn_dropout: 0.1
  max_seq_len: 2048
  causal: true
  window_size: 16
  stride: 8
  router_temperature: 1.0
  pooling:
    mode: soft_trimmed_boltzmann
    tau: 0.1
    q: 0.85
  pooling_multihead: false
  feature_mode: hashed_counts
  router_type: learned
  router_topk: 16
  router_multihead: true
  token_mlp:
    enabled: false
  backend_params:
    landmark_coverage: 0.25

data:
  dataset: wikitext2
  batch_size: 16
  seq_len: 2048

training:
  seed: 0
  epochs: 10
  lr: 0.0001
  warmup_steps: 1000
  set_diversity_weight: 0.0
  set_diversity_mode: position_contrastive
