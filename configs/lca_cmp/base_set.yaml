stage: mrp_lca_cmp
task: lca_cmp
model:
  implementation: set_only
  architecture: transformer_lm
  vocab_size: 128
  d_model: 384
  num_heads: 8
  num_layers: 6
  dim_feedforward: 1536
  dropout: 0.1
  attn_dropout: 0.1
  resid_dropout: 0.1
  ffn_dropout: 0.1
  max_seq_len: 1024
  attention_family: dense
  backend: exact
  backend_params: {}
  causal: true
  window_size: 4
  stride: 2
  pooling:
    mode: soft_trimmed_boltzmann
    tau: 0.1
    q: 0.85
  pooling_multihead: false
  feature_mode: hashed_counts
  router_type: learned
  router_topk: 16
  router_multihead: true
  router_temperature: 1.0
  token_mlp:
    enabled: false
data:
  dataset: lca_cmp
  vocab_size: 128
  seq_len: 1024
  batch_size: 4
  num_train_examples: 20000
  num_val_examples: 2048
  marker_fraction: 0.12
  count_jitter: 8
  dataset_seed: 1729
training:
  seed: 0
  lr: 0.0001
  max_updates: 10000
  warmup_steps: 500
  grad_accum_steps: 1
  eval_microbatch_size: null
  clip_grad_norm: 1.0
  weight_decay: 0.01
  output_dir: out/lca_cmp
logging:
  csv:
    path: out/lca_cmp/base_set.csv
